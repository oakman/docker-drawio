name: Publish to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 1.2.3). Leave empty to skip version tag."
        default: ""
      PUID:
        description: "User ID to run the container as"
        default: "11000"
      PGID:
        description: "Group ID to run the container as"
        default: "11000"
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - dev

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/drawio
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: main/
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/drawio-cache
          build-args: |
            PUID=${{ inputs.PUID || 11000 }}
            PGID=${{ inputs.PGID || 11000 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
